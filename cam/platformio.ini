; Dois ambientes: esp32s3cam (Freenove, o de hoje) e xiao (XIAO ESP32-S3 Sense). O padrao e a Freenove ate a XIAO
; ser validada na bancada; o PC escolhe por ponte/maquina.json (PLACA_ENV) e a autoprogramacao passa -e.
[platformio]
default_envs = esp32s3cam

[env:esp32s3cam]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM
; upload_port = COM22   ; sem porta fixa: o PlatformIO detecta a placa sozinho
; monitor_port = COM22
monitor_speed = 2000000
upload_speed = 921600
extra_scripts = pre:scripts/fotos_padrao.py
board_build.embed_files =
  data/face0.bin
  data/face1.bin
  data/face2.bin
  data/face3.bin
  data/face4.bin
  data/face5.bin
  data/face6.bin
  data/face7.bin
  data/face8.bin


; XIAO ESP32-S3 Sense: camera e microfone PDM na propria placa, USB nativo (sem CH343), flash de 8 MB.
; Compilar: pio run -d cam -e xiao     Gravar: pio run -d cam -e xiao -t upload
; Primeira gravacao: segure BOOT, plugue o USB (ou aperte RESET) e solte - depois grava sozinho.
[env:xiao]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions_xiao_8MB.csv
; a placa ja traz ARDUINO_USB_MODE=1 e ARDUINO_USB_CDC_ON_BOOT=1: o Serial e o USB nativo (o baud nao importa)
build_flags = -DBOARD_HAS_PSRAM -DPLACA_XIAO
monitor_speed = 2000000
upload_speed = 921600
extra_scripts = pre:scripts/fotos_padrao.py
board_build.embed_files =
  data/face0.bin
  data/face1.bin
  data/face2.bin
  data/face3.bin
  data/face4.bin
  data/face5.bin
  data/face6.bin
  data/face7.bin
  data/face8.bin