[env:esp32s3cam]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM
; upload_port = COM22   ; sem porta fixa: o PlatformIO detecta a placa sozinho
; monitor_port = COM22
monitor_speed = 2000000
upload_speed = 921600
extra_scripts = pre:scripts/fotos_padrao.py
board_build.embed_files =
  data/face0.bin
  data/face1.bin
  data/face2.bin
  data/face3.bin
  data/face4.bin
  data/face5.bin
  data/face6.bin
  data/face7.bin
  data/face8.bin
