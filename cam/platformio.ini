; Dois perfis de placa. Padrao: XIAO ESP32-S3 Sense.
;   pio run -t upload                      -> XIAO ESP32-S3 Sense (camera + microfone PDM embutidos)
;   pio run -e freenove_cam -t upload      -> Freenove ESP32-S3 CAM + INMP441 (montagem antiga)
; Sem porta fixa: o PlatformIO detecta a placa sozinho.

[platformio]
default_envs = xiao_sense

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 2000000
extra_scripts = pre:scripts/fotos_padrao.py
board_build.embed_files =
  data/face0.bin
  data/face1.bin
  data/face2.bin
  data/face3.bin
  data/face4.bin
  data/face5.bin
  data/face6.bin
  data/face7.bin
  data/face8.bin

[env:xiao_sense]
board = seeed_xiao_esp32s3
; 8 MB de flash: particao propria com app de 7,9 MB (o firmware tem ~4,4 MB por causa das fotos embutidas)
board_build.partitions = particoes_xiao_8MB.csv
build_flags = -DPLACA_XIAO_SENSE
upload_speed = 921600

[env:freenove_cam]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM -DPLACA_FREENOVE_CAM
upload_speed = 921600
